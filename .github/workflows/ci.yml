name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Souce code checkout
      uses: actions/checkout@v4

    - name: Python configuration
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Installing dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        # We also install a linter for static analysis
        pip install flake8

    - name: Static analysis of the code with Flake8
      run: |
        source venv/bin/activate
        # Runs the linter, flagging serious syntax errors (excluding any external folders)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Notice regarding general style warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics